# =============================================================================
# oauth2-proxy/oauth2-proxy.cfg — OAuth2-Proxy v7.15
# Integrado com Keycloak como OIDC Provider
# =============================================================================

# ---------------------------------------------------------------------------
# Provider — Keycloak via OIDC
# ---------------------------------------------------------------------------
provider = "keycloak-oidc"
provider_display_name = "SaaS Local SSO"

# URL base do Keycloak (interno via Docker network)
oidc_issuer_url = "https://auth.local.dev/realms/saas-local"

# Client registrado no realm "saas-local" do Keycloak
client_id = "oauth2-proxy"
# client_secret é injetado via env OAUTH2_PROXY_CLIENT_SECRET

# Scopes solicitados ao Keycloak
scope = "openid email profile roles"

# Extrai grupos e roles do token JWT
oidc_groups_claim = "groups"
oidc_email_claim = "email"

# ---------------------------------------------------------------------------
# URLs e Rotas
# ---------------------------------------------------------------------------
# URL pública do proxy (onde o browser redireciona após login)
redirect_url = "https://app.local.dev/oauth2/callback"

# URL para onde o proxy faz o ForwardAuth internamente
# (Traefik usa: http://oauth2-proxy:4180/oauth2/auth)
http_address = "0.0.0.0:4180"

# ---------------------------------------------------------------------------
# Cookie de Sessão
# ---------------------------------------------------------------------------
# cookie_secret é injetado via env OAUTH2_PROXY_COOKIE_SECRET
# Gere com: openssl rand -base64 32

cookie_name     = "_oauth2_proxy"
cookie_secure   = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire   = "24h"
cookie_refresh  = "1h"

# Domínio que o cookie abrange
cookie_domains = [".local.dev"]

# ---------------------------------------------------------------------------
# Upstream — Para onde o proxy redireciona após autenticação
# (só relevante quando o OAuth2-Proxy serve como proxy completo,
#  não como middleware ForwardAuth do Traefik)
# ---------------------------------------------------------------------------
upstreams = ["http://app1:80"]

# ---------------------------------------------------------------------------
# Controle de Acesso
# ---------------------------------------------------------------------------
# Permite apenas e-mails verificados
email_domains = ["*"]   # restrinja ao seu domínio: ["suaempresa.com"]

# Política padrão do stack local: exige o realm role e o grupo do realm exportado
allowed_roles = ["user"]
allowed_groups = ["/app-users"]

# ---------------------------------------------------------------------------
# Headers injetados upstream (lidos pelo Traefik via authResponseHeaders)
# ---------------------------------------------------------------------------
set_xauthrequest = true
pass_access_token = true
pass_authorization_header = true

# Injeta info do usuário autenticado nos headers
set_authorization_header = true

# ---------------------------------------------------------------------------
# Página de Login
# ---------------------------------------------------------------------------
# Template customizado (opcional)
# custom_templates_dir = "/templates"

# Não exibe a página de login interna — redireciona direto ao Keycloak
skip_provider_button = true

# ---------------------------------------------------------------------------
# Endpoints públicos (bypass de autenticação)
# ---------------------------------------------------------------------------
code_challenge_method = "S256"

skip_auth_routes = [
  "^/healthz$",
  "^/metrics$",
  "^/api/public/.*"
]

# ---------------------------------------------------------------------------
# Segurança
# ---------------------------------------------------------------------------
# Valida o campo "aud" do JWT
oidc_audience_claims = "aud"

# Rejeita tokens emitidos para outros clients
# extra_jwt_issuers = []

# Modo silencioso para chamadas de API (retorna 401 ao invés de redirect)
# Descomente se quiser distinguir browsers de API clients:
# skip_jwt_bearer_tokens = false
# jwt_key = ""   # JWKS do Keycloak — buscado automaticamente via OIDC discovery

# ---------------------------------------------------------------------------
# TLS — Confia no certificado autoassinado do ambiente local
# ---------------------------------------------------------------------------
ssl_insecure_skip_verify = true   # ⚠️ apenas local — remova em produção

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging_filename = ""   # stdout
standard_logging = true
request_logging  = true
auth_logging     = true
