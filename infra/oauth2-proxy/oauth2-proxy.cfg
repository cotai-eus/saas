# =============================================================================
# oauth2-proxy/oauth2-proxy.cfg — OAuth2-Proxy v7.15
# =============================================================================

provider = "keycloak-oidc"
provider_display_name = "SaaS Local SSO"
oidc_issuer_url = "https://auth.local.dev/realms/saas-local"
client_id = "oauth2-proxy"
scope = "openid email profile roles"
oidc_groups_claim = "groups"
oidc_email_claim = "email"

redirect_url = "https://app.local.dev/oauth2/callback"
http_address = "0.0.0.0:4180"

cookie_name     = "_oauth2_proxy"
cookie_secure   = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire   = "24h"
cookie_refresh  = "1h"
cookie_domains = [".local.dev"]

upstreams = ["http://app1:80"]

email_domains = ["local.dev"]
allowed_roles = ["user"]
allowed_groups = ["/app-users"]

set_xauthrequest = true
pass_access_token = true
pass_authorization_header = true
set_authorization_header = true

skip_provider_button = true
code_challenge_method = "S256"

skip_auth_routes = [
  "^/healthz$",
  "^/metrics$",
  "^/api/public/.*"
]

oidc_audience_claims = "aud"
skip_jwt_bearer_tokens = true

# ⚠️ APENAS PARA DESENVOLVIMENTO LOCAL
ssl_insecure_skip_verify = true 

# Logging
standard_logging = true
auth_logging     = true
# request_logging  = true # Comentado para evitar o erro de duplicidade misteriosa
