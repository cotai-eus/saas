# =============================================================================
# SaaS Platform — Agnostic Stack
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-saas}

networks:
  proxy:
    external: true
  internal:
    name: ${COMPOSE_PROJECT_NAME:-saas}-internal
    driver: bridge
    internal: true

volumes: 
  keycloak_db_data:
  keycloak_data:
  app_db_data:
  letsencrypt_data:

services:

  # ── TRAEFIK ────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.7@sha256:6b9cbca6fac42ab0075f5437d8dc1685cfd188626d8d515839ea94f8b6271c42
    container_name: ${COMPOSE_PROJECT_NAME:-saas}-traefik
    restart: unless-stopped
    networks: [proxy, internal]
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    environment:
      - BASE_DOMAIN
      - TLS_RESOLVER
      - LETSENCRYPT_EMAIL
      - TRAEFIK_DASHBOARD_PASSWORD_HASH
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/config:/etc/traefik/config:ro
      - ./traefik/certs:/certs:ro
      - letsencrypt_data:/letsencrypt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=${TLS_RESOLVER}"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=basic-auth@file"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── KEYCLOAK DATABASE ──────────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: ${COMPOSE_PROJECT_NAME:-saas}-keycloak-db
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB:       ${KC_DB_NAME:-keycloak}
      POSTGRES_USER:     ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?required}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── APPLICATION DATABASE ───────────────────────────────────────────────────
  app-db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    container_name: ${COMPOSE_PROJECT_NAME:-saas}-app-db
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_DB:       ${DB_NAME:-saas}
      POSTGRES_USER:     ${DB_USER:-saas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - app_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-saas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── KEYCLOAK ───────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.6@sha256:f9ba7b2af90db8dc749a57ca9aedca51e840cb9224441ab546a968da941da900
    container_name: ${COMPOSE_PROJECT_NAME:-saas}-keycloak
    restart: unless-stopped
    networks: [proxy, internal]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        envsubst < /opt/keycloak/data/import/realm-template.json \
          > /opt/keycloak/data/import/realm-saas.json
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB:               postgres
      KC_DB_URL:           jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME:      ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD:      ${KC_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?required}
      KC_PROXY_HEADERS:    xforwarded
      KC_HTTP_ENABLED:     "true"
      KC_HOSTNAME:         ${AUTH_HOST}
      KC_HOSTNAME_STRICT:  "true"
      KC_CACHE:            local
      KC_FEATURES:         token-exchange,admin-fine-grained-authz
      KC_LOG_LEVEL:        INFO
      KC_HEALTH_ENABLED:   "true"
      KC_METRICS_ENABLED:  "true"
      # Variables for envsubst
      BASE_DOMAIN:         ${BASE_DOMAIN}
      APP_HOST:            ${APP_HOST}
      AUTH_HOST:           ${AUTH_HOST}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?required}
      SAAS_API_CLIENT_SECRET:     ${SAAS_API_CLIENT_SECRET:?required}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/realm-template.json:/opt/keycloak/data/import/realm-template.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.keycloak.rule=Host(`${AUTH_HOST}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=${TLS_RESOLVER}"
      - "traefik.http.routers.keycloak.middlewares=security-headers@file"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -c 'exec 3<>/dev/tcp/localhost/9000 &&
          printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
          grep "200" <&3'
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── OAUTH2-PROXY ───────────────────────────────────────────────────────────
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.0-alpine@sha256:8caf464e485b9cad9ff02aaed4a48e6aef358cc968065e1b1716e920c1ac5f5c
    container_name: ${COMPOSE_PROJECT_NAME:-saas}-oauth2-proxy
    restart: unless-stopped
    networks: [proxy, internal]
    extra_hosts:
      - "${AUTH_HOST}:host-gateway"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Alpine doesn't have envsubst by default, but we can install it or use sed
        # For Alpine-based images, we usually need to install gettext or use a different approach.
        # Let's try to install it on the fly if missing, or use a simple sed for basic var replacement.
        if ! command -v envsubst >/dev/null; then apk add --no-cache gettext; fi
        envsubst < /etc/oauth2-proxy/oauth2-proxy.cfg.tmpl \
          > /etc/oauth2-proxy/oauth2-proxy.cfg
        exec /bin/oauth2-proxy --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    environment:
      BASE_DOMAIN:                ${BASE_DOMAIN}
      AUTH_HOST:                  ${AUTH_HOST}
      APP_HOST:                   ${APP_HOST}
      OAUTH2_PROXY_CLIENT_ID:     ${OAUTH2_PROXY_CLIENT_ID:-oauth2-proxy}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?required}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?required}
      OAUTH2_PROXY_SSL_INSECURE:  ${OAUTH2_PROXY_SSL_INSECURE:-false}
    volumes:
      - ./oauth2-proxy/oauth2-proxy.cfg.tmpl:/etc/oauth2-proxy/oauth2-proxy.cfg.tmpl:ro
    depends_on:
      keycloak:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.oauth2-proxy.rule=Host(`${APP_HOST}`) && PathPrefix(`/oauth2`)"
      - "traefik.http.routers.oauth2-proxy.entrypoints=websecure"
      - "traefik.http.routers.oauth2-proxy.tls=true"
      - "traefik.http.routers.oauth2-proxy.tls.certresolver=${TLS_RESOLVER}"
      - "traefik.http.routers.oauth2-proxy.priority=100"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4180/ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── BACKEND (Python / FastAPI) ─────────────────────────────────────────────
  backend:
    build: ../backend/
    container_name: ${COMPOSE_PROJECT_NAME:-saas}-backend
    restart: unless-stopped
    networks: [proxy, internal]
    environment:
      DB_NAME:     ${DB_NAME:-saas}
      DB_USER:     ${DB_USER:-saas}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      DB_HOST:     ${DB_HOST:-app-db}
      DB_PORT:     ${DB_PORT:-5432}
    depends_on:
      app-db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.backend.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=${TLS_RESOLVER}"
      - "traefik.http.routers.backend.middlewares=oauth2-auth@file,security-headers@file"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FRONTEND (Vite + React) ────────────────────────────────────────────────
  frontend:
    build: ../frontend/
    container_name: ${COMPOSE_PROJECT_NAME:-saas}-frontend
    restart: unless-stopped
    networks: [proxy, internal]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.frontend.rule=Host(`${API_HOST}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=${TLS_RESOLVER}"
      - "traefik.http.routers.frontend.middlewares=security-headers@file,rate-limit@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
