# =============================================================================
# traefik/traefik.yml — Configuração Estática do Traefik v3.7
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ---------------------------------------------------------------------------
# API & Dashboard
# ---------------------------------------------------------------------------
api:
  dashboard: true
  insecure: false   # exposto via roteador com BasicAuth

# ---------------------------------------------------------------------------
# Ping (healthcheck interno)
# ---------------------------------------------------------------------------
ping:
  entryPoint: traefik

# ---------------------------------------------------------------------------
# Entry Points
# ---------------------------------------------------------------------------
entryPoints:

  # Porta interna usada pelo ping
  traefik:
    address: ":8080"

  # HTTP — redireciona todo tráfego para HTTPS
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  # HTTPS — TLS obrigatório
  websecure:
    address: ":443"
    http:
      tls: {}
      middlewares:
        - security-headers@file
    # Proteção contra slowloris / DDoS básico
    transport:
      respondingTimeouts:
        readTimeout: 30s
        writeTimeout: 30s
        idleTimeout: 120s

# ---------------------------------------------------------------------------
# Providers
# ---------------------------------------------------------------------------
providers:

  # Docker provider — descobre serviços via labels
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false     # IMPORTANTE: só expõe containers com label enable=true
    network: proxy
    watch: true

  # File provider — middlewares reutilizáveis e configurações dinâmicas
  file:
    directory: /etc/traefik/config
    watch: true

# ---------------------------------------------------------------------------
# TLS — Certificados locais (mkcert)
# ---------------------------------------------------------------------------
tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.dev.crt
        keyFile:  /certs/local.dev.key

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        # Não loga headers sensíveis
        Authorization: drop
        Cookie: drop

# ---------------------------------------------------------------------------
# Métricas (opcional — descomente para usar com Prometheus)
# ---------------------------------------------------------------------------
# metrics:
#   prometheus:
#     entryPoint: traefik
#     addEntryPointsLabels: true
#     addServicesLabels: true
