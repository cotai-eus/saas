# =============================================================================
# traefik/config/middlewares.yml — Agnostic Dynamic Configuration
# =============================================================================

http:

  middlewares:

    # ── BasicAuth ────────────────────────────────────────────────────────────
    basic-auth:
      basicAuth:
        usersFile: "/etc/traefik/config/.htpasswd"
        removeHeader: true

    # ── ForwardAuth (SSO) ───────────────────────────────────────────────────
    oauth2-auth:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Groups"
          - "X-Auth-Request-Access-Token"
          - "Authorization"
        maxResponseBodySize: 1048576  # 1MB — ajuste conforme necessário

    # ── Security Headers ─────────────────────────────────────────────────────
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    api-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""

    # ── CORS ─────────────────────────────────────────────────────────────────
    cors-api:
      headers:
        accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        accessControlAllowHeaders:
          - "Content-Type"
          - "Authorization"
          - "X-Requested-With"
        # Dynamic regex based on BASE_DOMAIN injected at runtime
        accessControlAllowOriginListRegex:
          - '^https://[a-z0-9-]+\.{{ env "BASE_DOMAIN" }}$'
        accessControlMaxAge: 86400
        addVaryHeader: true

    # ── Rate Limiting ────────────────────────────────────────────────────────
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m
        sourceCriterion:
          ipStrategy:
            depth: 1

    # ── Compress ─────────────────────────────────────────────────────────────
    compress:
      compress:
        minResponseBodyBytes: 1024
